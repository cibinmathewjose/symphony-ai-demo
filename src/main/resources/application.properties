spring.application.name=symphony-ai-demo
spring.config.import=optional:file:./.env[.properties]
spring.main.web-application-type=reactive
server.address=127.0.0.1
server.port=8085
spring.datasource.url=jdbc:h2:mem:symphonydemo;DB_CLOSE_DELAY=-1
spring.datasource.driver.class=org.h2.Driver
# Local in-memory reader; IFEXISTS prevents creating a separate empty database.
symphony.db.demo-h2.url=jdbc:h2:mem:symphonydemo;IFEXISTS=TRUE
symphony.db.demo-h2.username=DEMO_READER
symphony.db.demo-h2.password=
spring.data.jpa.repositories.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
spring.ai.model.chat=azure-openai


spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.mcp.client.enabled=false
spring.ai.mcp.server.enabled=false
symphony.mcp.client.enabled=true
symphony.mcp.server.enabled=true
ai.client.library.type=StringAI
symphony.log.prompt.enabled=true

spring.ai.azure.openai.api-key=${AZURE_OPENAI_API_KEY}

spring.ai.azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT}
client.azureopenai.key=${AZURE_OPENAI_API_KEY}

#spring.ai.azure.openai.chat.options.deployment-name=${AZURE_OPENAI_DEPLOYMENT:model-router}
spring.ai.azure.openai.chat.options.deployment-name=model-router

#client.azureopenai.deploymentname=${AZURE_OPENAI_DEPLOYMENT:gpt-4.1}
client.azureopenai.deploymentname=gpt-4.1

client.azureopenai.endpoint=${AZURE_OPENAI_ENDPOINT}
spring.ai.anthropic.base-url=${AZURE_OPENAI_ENDPOINT_ANTHROPIC}
spring.ai.anthropic.api-key=${AZURE_OPENAI_API_KEY}

client.azureopenai.maxInputLength=1000000
client.azureopenai.models={"claude-sonnet-5-5":"claude-sonnet-5-5","gpt-6-sol":"gpt-6-sol","gpt-4o":"gpt-4o","gpt-4.1":"gpt-4.1","model-router":"model-router","gpt-5.2-chat":"gpt-5.2-chat","claude-opus-4-6":"claude-opus-4-6"}
client.azureopenai.gpt-5-nano.options.maxCompletionTokens=15000
client.azureopenai.gpt-5-nano.options.temperature=1  
client.azureopenai.gpt-4.1.options.maxTokens=32760
client.azureopenai.gpt-4.1.options.temperature=0.0
client.azureopenai.model-router.options.maxTokens=15000
client.azureopenai.model-router.options.temperature=0.0
client.azureopenai.gpt-5.2-chat.options.max_completion_tokens=15000
client.azureopenai.gpt-5.2-chat.options.temperature=1
client.azureopenai.claude-opus-4-6.options.maxTokens=25000
client.azureopenai.claude-opus-4-6.options.temperature=1
client.azureopenai.claude-opus-4-6.options.provider=anthropic

client.azureopenai.claude-sonnet-5-5.options.maxTokens=25000
client.azureopenai.claude-sonnet-5-5.options.temperature=1
client.azureopenai.claude-sonnet-5-5.options.provider=anthropic

client.azureopenai.gpt-6-sol.options.max_completion_tokens=1000000
client.azureopenai.gpt-6-sol.options.temperature=1
client.azureopenai.gpt-6-sol.options.reasoning_effort=medium
#low, medium, high, xhigh, or max
client.azureopenai.name=copilot-assistant
maxhistory=3

spring.ai.azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT}


